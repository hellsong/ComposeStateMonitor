[versions]
composemonitorplugin = "0.2.0"
kotlin = "2.3.21"
compose-multiplatform = "1.11.1"
gradle-android = "8.10.0"
gradle-jvmToolchain = "21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
material = "1.13.0"

[libraries]
# The oldest supported KGP: the Gradle plugin compiles against it. Compiler lines are in plugin/build.gradle.kts.
kotlin-gradle-api-floor = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version = "2.0.0" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
# The Compose runtime the published composemonitorhelper is built against (runtime-publish/). The oldest one supported.
compose-mp-runtime-floor = { module = "org.jetbrains.compose.runtime:runtime", version = "1.6.11" }
# Compose runtime 1.6.11 uses coroutines 1.8.0 but doesn't expose them to compilation.
kotlinx-coroutines-core-floor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.8.0" }
compose-mp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-mp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-mp-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.9.1" }
# Keep the androidx Compose runtime on the same line as compose-multiplatform (1.11.x).
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.06.01" }
compose-activity = { module = "androidx.activity:activity-compose", version = "1.11.0" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[bundles]
compose = ["compose-activity", "compose-material3", "compose-uiTooling"]

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "gradle-android" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "gradle-android" }
com-android-library = { id = "com.android.library", version.ref = "gradle-android" }
publish = { id = "com.gradle.plugin-publish", version = "2.0.0" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.1.2" }
composeStateMonitor = { id = "io.github.hellsong.composemonitor", version.ref = "composemonitorplugin" }
